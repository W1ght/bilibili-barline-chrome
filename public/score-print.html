<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音乐谱面</title>
<style>
:root{--text:#18191c;--muted:#61666d;--line:#e3e5e7;--accent:#00aeec;--bg:#f6f7f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.bar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line)}
.bar label{display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.bar button{margin-left:auto;padding:8px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:600 14px system-ui;cursor:pointer}
.bar button:hover{filter:brightness(1.06)}
main{max-width:980px;margin:24px auto;padding:32px 40px;background:#fff;border-radius:12px;box-shadow:0 2px 16px #0000000d}
h1{margin:0 0 4px;font-size:22px}
.meta{margin:0 0 18px;color:var(--muted);font-size:12px}.meta a{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.legend span{padding:1px 8px;border-radius:999px;border:1px solid var(--c);color:var(--c);font-size:12px}
figure{margin:0 0 14px;break-inside:avoid}
figure img{display:block;width:100%}
figcaption{display:flex;gap:8px;align-items:center;margin-bottom:4px;color:var(--muted);font-size:11px}
figcaption b{color:var(--text)}
figcaption em{font-style:normal;padding:0 6px;border-radius:999px;border:1px solid var(--accent);color:var(--accent)}
figcaption i{font-style:normal;padding:0 6px;border-radius:999px;color:#fff;background:var(--c)}
body.no-captions figcaption{display:none}
body.compact figure{margin-bottom:4px}
.empty{color:var(--muted);text-align:center;padding:60px 0}
@media print{body{background:#fff}.bar{display:none}main{max-width:none;margin:0;padding:0;box-shadow:none}@page{size:A4;margin:12mm}}
</style></head>
<body><div class="bar"><label title="反复记号等让同一行演奏多次时，每行只印一次，标注各次演奏时间"><input type="checkbox" id="merge" checked>合并重复行</label><label><input type="checkbox" id="captions" checked>显示行号与时间</label><label><input type="checkbox" id="compact">紧凑排版</label><button id="print">打印 / 另存为 PDF</button></div>
<main><h1 id="title">正在加载…</h1><p class="meta" id="meta"></p><div class="legend" id="legend"></div><div id="score"></div></main>
<script src="score-print.js"></script></body></html>
