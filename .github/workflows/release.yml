name: Release

# Push a tag like v1.9.0 (must match manifest.json "version") to build and publish
# the extension ZIP as a GitHub Release. Can also be run by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Resolve version
        id: version
        run: |
          version=$(node -p "require('./public/manifest.json').version")
          tag="v$version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Package
        run: cd dist && zip -r "../bilibili-barline-chrome-${{ steps.version.outputs.version }}.zip" .

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: bilibili-barline-chrome-${{ steps.version.outputs.version }}.zip
        run: |
          notes="安装：解压 ZIP 到固定文件夹 → chrome://extensions 打开开发者模式 → 加载已解压的扩展程序，选择解压后的文件夹。更新：覆盖文件后在扩展管理页点「重新加载」，再刷新 B 站视频页。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "B站音乐小节线 $TAG" --notes "$notes" --generate-notes
          fi
